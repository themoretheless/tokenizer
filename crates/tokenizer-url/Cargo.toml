[package]
name = "themoretheless-tokenizer-url"
version = "0.4.0"
edition = "2024"
authors = ["Denis Mezhov"]
description = "Lossless URL and path tokenizer with lightweight validation for editor highlighting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
readme = "README.md"
publish = ["crates-io"]
keywords = ["tokenizer", "lexer", "url", "path", "syntax-highlighting"]
categories = ["parsing", "text-processing"]

[lib]
name = "themoretheless_tokenizer_url"
path = "src/lib.rs"

[dependencies]
themoretheless-tokenizer-core = { path = "../tokenizer-core", version = "0.4.0" }

[package.metadata.docs.rs]
all-features = true
