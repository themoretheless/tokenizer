[package]
name = "themoretheless-tokenizer-srt"
version = "0.4.0"
edition = "2024"
authors = ['Denis Mezhov']
description = "Full SubRip (srt) and WebVTT (vtt) engine (lex/parse/validate) for themoretheless-tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
readme = "README.md"
publish = ['crates-io']
keywords = ["tokenizer", "lexer", "subtitle", "srt", "vtt", "webvtt", "parser"]
categories = ['parsing', 'text-processing']

[lib]
name = "themoretheless_tokenizer_srt"
path = "src/lib.rs"

[dependencies]
themoretheless-tokenizer-core = { path = "../tokenizer-core", version = "0.4.0" }

[package.metadata.docs.rs]
all-features = true
