[package]
name = "themoretheless-tokenizer-rush"
version = "0.7.0"
edition = "2024"
authors = ["Denis Mezhov"]
description = "Full rush engine (lex/parse/AST/semantic) for themoretheless-tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
readme = "README.md"
publish = ["crates-io"]
keywords = ["tokenizer", "lexer", "rush", "parser"]
categories = ["parsing", "text-processing"]

[lib]
name = "themoretheless_tokenizer_rush"
path = "src/lib.rs"

[dependencies]
self_cell = "1"
serde = { version = "1", features = ["derive"] }
themoretheless-tokenizer-core = { path = "../tokenizer-core", version = "0.7.0" }

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "cancellation"
harness = false

[[bench]]
name = "allocator"
harness = false

[dev-dependencies]
serde_json = "1.0.151"

[[bench]]
name = "grouping"
harness = false

[[bench]]
name = "scalar_bytecode"
harness = false

[[bench]]
name = "scalar_memory"
harness = false

[[bench]]
name = "scalar_closures"
harness = false
