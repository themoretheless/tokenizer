[package]
name = "themoretheless-tokenizer-rush"
version = "0.8.0"
edition = "2024"
authors = ["Denis Mezhov"]
description = "Full rush engine (lex/parse/AST/semantic) for themoretheless-tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
readme = "README.md"
publish = ["crates-io"]
keywords = ["tokenizer", "lexer", "rush", "parser"]
categories = ["parsing", "text-processing"]

[lib]
name = "themoretheless_tokenizer_rush"
path = "src/lib.rs"

[[bin]]
name = "rush"
path = "src/bin/rush.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = [
    "dep:self_cell",
    "dep:serde",
    "dep:themoretheless-tokenizer-json",
    "dep:libc",
]

[dependencies]
self_cell = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
themoretheless-tokenizer-core = { path = "../tokenizer-core", version = "0.8.0" }
themoretheless-tokenizer-json = { path = "../tokenizer-json", version = "0.8.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1.0.151"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "runtime"
harness = false
required-features = ["runtime"]

[[bench]]
name = "memory"
harness = false
required-features = ["runtime"]

[[bench]]
name = "cancellation"
harness = false
required-features = ["runtime"]

[[bench]]
name = "allocator"
harness = false
required-features = ["runtime"]

[[bench]]
name = "grouping"
harness = false
required-features = ["runtime"]

[[bench]]
name = "scalar_bytecode"
harness = false
required-features = ["runtime"]

[[bench]]
name = "scalar_memory"
harness = false
required-features = ["runtime"]

[[bench]]
name = "scalar_closures"
harness = false
required-features = ["runtime"]

[[bench]]
name = "loading"
harness = false
required-features = ["runtime"]

[[bench]]
name = "coroutine"
harness = false
required-features = ["runtime"]

[[bench]]
name = "remainder"
harness = false
required-features = ["runtime"]

[[bench]]
name = "bytecode_vm"
harness = false
required-features = ["runtime"]

[[bench]]
name = "inventory"
harness = false
required-features = ["runtime"]
