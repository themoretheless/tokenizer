[package]
name = "themoretheless-tokenizer-hcl"
version = "0.4.0"
edition = "2024"
authors = ['Denis Mezhov']
description = "Full HCL engine (lex/parse/validate) for themoretheless-tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
readme = "README.md"
publish = ['crates-io']
keywords = ["tokenizer", "lexer", "hcl", "infrastructure-as-code", "parser"]
categories = ['parsing', 'text-processing']

[lib]
name = "themoretheless_tokenizer_hcl"
path = "src/lib.rs"

[dependencies]
themoretheless-tokenizer-core = { path = "../tokenizer-core", version = "0.4.0" }

[package.metadata.docs.rs]
all-features = true
