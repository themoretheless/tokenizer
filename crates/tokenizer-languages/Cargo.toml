[package]
name = "themoretheless-tokenizer-languages"
version = "0.8.0"
edition = "2024"
authors = ["Denis Mezhov"]
description = "Table-driven multi-language syntax engines (49 programming & query languages) for themoretheless-tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
readme = "README.md"
publish = ["crates-io"]
keywords = ["tokenizer", "lexer", "parser", "syntax-highlighting"]
categories = ["parsing", "text-processing"]

[lib]
name = "themoretheless_tokenizer_languages"
path = "src/lib.rs"

[dependencies]
themoretheless-tokenizer-core = { path = "../tokenizer-core", version = "0.8.0" }

[features]
default = []
abap = []
ada = []
assembly = []
bash = []
c = []
clojure = []
cobol = []
cpp = []
csharp = []
dart = []
delphi = []
