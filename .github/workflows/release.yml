name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: >-
          rustup toolchain install stable
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Compare package versions
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          old_version=$(
            git show "${BEFORE}:Cargo.toml" |
              sed -n 's/^version = "\(.*\)"/\1/p' |
              head -1
          )
          new_version=$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[0].version'
          )

          echo "old=${old_version}" >> "$GITHUB_OUTPUT"
          echo "new=${new_version}" >> "$GITHUB_OUTPUT"

          if [[ "$old_version" == "$new_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version is unchanged: ${new_version}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: ${old_version} -> ${new_version}"
          fi

      - name: Check formatting
        if: steps.version.outputs.changed == 'true'
        run: cargo fmt --check

      - name: Run Clippy
        if: steps.version.outputs.changed == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: cargo test --locked

      - name: Ensure version was not released
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: v${{ steps.version.outputs.new }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Version ${TAG} has already been released"
            exit 1
          fi

      - name: Create tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.new }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          release_flags=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$TAG" "${release_flags[@]}"
