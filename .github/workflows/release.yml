name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed version
    permissions:
      contents: write
    uses: themoretheless/.github/.github/workflows/release-rust-library.yml@v1
