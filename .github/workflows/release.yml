name: Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter "release vX.Y.Z" after crates.io confirms the version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@345346381f30bbcdb6ba4899f29af8925fd4b6d3 # PR #11
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@345346381f30bbcdb6ba4899f29af8925fd4b6d3 # PR #11
        with:
          package-name: themoretheless-tokenizer

      - name: Validate release version
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Run this workflow against a branch, not a tag"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" && "${PRERELEASE}" != "true" ]]; then
            echo "::error::Only prerelease versions may be released outside main"
            exit 1
          fi

          expected="release ${TAG}"
          if [[ "${CONFIRMATION}" != "${expected}" ]]; then
            echo "::error::Confirmation must be exactly: ${expected}"
            exit 1
          fi

      - name: Verify package
        run: cargo package --locked --package themoretheless-tokenizer

      - name: Validate existing tag state
        id: tag
        env:
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            tag_commit=$(git rev-parse "${TAG}^{commit}")
            head_commit=$(git rev-parse HEAD)
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "::error::Existing ${TAG} points to ${tag_commit}, not ${head_commit}"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm version exists on crates.io
        env:
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(
            curl --fail --retry 5 --retry-all-errors --silent --show-error \
              --user-agent "themoretheless-tokenizer-release/1.0" \
              "https://crates.io/api/v1/crates/themoretheless-tokenizer/${VERSION}"
          )
          actual=$(jq -r '.version.num' <<<"${response}")
          if [[ "${actual}" != "${VERSION}" ]]; then
            echo "::error::crates.io returned version ${actual}, expected ${VERSION}"
            exit 1
          fi
          if [[ "$(jq -r '.version.yanked' <<<"${response}")" == "true" ]]; then
            echo "::error::crates.io version ${VERSION} is yanked"
            exit 1
          fi

          archive="target/package/themoretheless-tokenizer-${VERSION}.crate"
          local_checksum=$(sha256sum "${archive}" | awk '{print $1}')
          registry_checksum=$(jq -r '.version.checksum' <<<"${response}")
          if [[ "${local_checksum}" != "${registry_checksum}" ]]; then
            echo "::error::Local package checksum does not match crates.io; refusing to tag a different commit"
            exit 1
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.tag.outputs.exists }}" != "true" ]]; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          release_flags=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${release_flags[@]}"
          fi
