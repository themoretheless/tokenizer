name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo package version (for example, 0.3.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          package-name: themoretheless-tokenizer

      - name: Validate release version
        uses: themoretheless/.github/.github/actions/validate-package-release@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          version: ${{ steps.package.outputs.version }}
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          requested-version: ${{ inputs.version }}

      - name: Validate existing tag state
        id: tag
        uses: themoretheless/.github/.github/actions/validate-release-tag@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          tag: ${{ steps.package.outputs.tag }}

      - name: Create tag and GitHub Release
        uses: themoretheless/.github/.github/actions/create-github-release@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          tag-exists: ${{ steps.tag.outputs.exists }}
          github-token: ${{ github.token }}
