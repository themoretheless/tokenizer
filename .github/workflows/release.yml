name: Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter "release vX.Y.Z"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          package-name: themoretheless-tokenizer

      - name: Validate release version
        uses: themoretheless/.github/.github/actions/validate-package-release@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          version: ${{ steps.package.outputs.version }}
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          confirmation: ${{ inputs.confirmation }}
          confirmation-prefix: release

      - name: Validate existing tag state
        id: tag
        uses: themoretheless/.github/.github/actions/validate-release-tag@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          tag: ${{ steps.package.outputs.tag }}

      - name: Create tag and GitHub Release
        uses: themoretheless/.github/.github/actions/create-github-release@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          tag-exists: ${{ steps.tag.outputs.exists }}
          github-token: ${{ github.token }}
