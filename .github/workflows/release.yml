name: Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter "release vX.Y.Z"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@a428a5fcc587a8a0e5d0b747123bed19968fa326 # PR #11
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@a428a5fcc587a8a0e5d0b747123bed19968fa326 # PR #11
        with:
          package-name: themoretheless-tokenizer

      - name: Validate release version
        uses: themoretheless/.github/.github/actions/validate-package-release@a428a5fcc587a8a0e5d0b747123bed19968fa326 # PR #11
        with:
          version: ${{ steps.package.outputs.version }}
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          confirmation: ${{ inputs.confirmation }}
          confirmation-prefix: release

      - name: Validate existing tag state
        id: tag
        uses: themoretheless/.github/.github/actions/validate-release-tag@a428a5fcc587a8a0e5d0b747123bed19968fa326 # PR #11
        with:
          tag: ${{ steps.package.outputs.tag }}

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          TAG: ${{ steps.package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.tag.outputs.exists }}" != "true" ]]; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          release_flags=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${release_flags[@]}"
          fi
