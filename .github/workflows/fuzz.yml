name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json:
    name: JSON invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly-2026-07-17
        with:
          toolchain: nightly-2026-07-17

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz lexer, parser, and semantic invariants
        run: cargo fuzz run json -- -max_total_time=180 -timeout=5

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: json-fuzz-artifacts
          path: fuzz/artifacts/json
          if-no-files-found: ignore
