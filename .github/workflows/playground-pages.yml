name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vue
        uses: themoretheless/.github/.github/actions/setup-vue@3c98211e3401beaec88776ef5901f45ed6565692 # v1
        with:
          node-version: 22.13.0
          npm-cache-dependency-path: playground/package-lock.json

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust-wasm@3c98211e3401beaec88776ef5901f45ed6565692 # v1
        with:
          rust-version: 1.96.0
          wasm-pack-version: 0.14.0
          wasm-bindgen-cli-version: 0.2.126

      - name: Install JavaScript dependencies
        run: npm ci --prefix playground

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Build GitHub Pages site
        run: npm --prefix playground run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground/dist

  deploy_github_pages:
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: themoretheless/.github/.github/workflows/deploy-github-pages.yml@3c98211e3401beaec88776ef5901f45ed6565692 # v1
