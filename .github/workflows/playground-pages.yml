name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@a6c40a906bc786a3668362d270ca95212b5bffce # v7.0.1

      - name: Set up Vue
        uses: themoretheless/.github/.github/actions/setup-vue@a6c40a906bc786a3668362d270ca95212b5bffce # v1
        with:
          node-version: 22.13.0
          npm-cache-dependency-path: playground/package-lock.json
          working-directory: playground

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust@a6c40a906bc786a3668362d270ca95212b5bffce # v1
        with:
          rust-toolchain: beta
          targets: wasm32-unknown-unknown
          tools: wasm-pack@0.14.0,wasm-bindgen-cli@0.2.126

      - name: Build GitHub Pages site
        run: npm --prefix playground run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@a6c40a906bc786a3668362d270ca95212b5bffce # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@a6c40a906bc786a3668362d270ca95212b5bffce # v5.0.0
        with:
          path: playground/dist

  deploy_github_pages:
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: themoretheless/.github/.github/workflows/deploy-github-pages.yml@a6c40a906bc786a3668362d270ca95212b5bffce # v1
