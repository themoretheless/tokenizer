name: Workspace CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Check package
        run: cargo package --locked

  build:
    name: Workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets --all-features

  tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSON_TEST_SUITE_REVISION: 1ef36fa01286573e846ac449e8683f8833c5b26a

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Fetch pinned JSONTestSuite corpus
        shell: bash
        run: |
          set -euo pipefail
          suite_dir="${RUNNER_TEMP}/json-test-suite"
          git init "${suite_dir}"
          git -C "${suite_dir}" remote add origin https://github.com/nst/JSONTestSuite.git
          git -C "${suite_dir}" sparse-checkout init --cone
          git -C "${suite_dir}" sparse-checkout set test_parsing
          git -C "${suite_dir}" fetch --depth=1 --filter=blob:none origin "${JSON_TEST_SUITE_REVISION}"
          git -C "${suite_dir}" checkout --detach FETCH_HEAD

      - name: Run JSON conformance corpus
        env:
          JSON_TEST_SUITE: ${{ runner.temp }}/json-test-suite
        run: cargo test --locked --test json_conformance -- --nocapture

  msrv_tests:
    name: Workspace tests (MSRV 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.85.0

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features
