name: Workspace CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace
    uses: themoretheless/.github/.github/workflows/rust-ci.yml@v1
    with:
      rust_toolchain: stable
      clippy_args: --locked --workspace --all-targets --all-features
      build_args: --locked --workspace --all-targets --all-features
      test_args: --locked --workspace --all-targets --all-features

  library:
    name: Library checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Check package
        run: cargo package --locked

  conformance:
    name: JSON conformance
    needs: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run project JSON fixtures
        run: cargo test --locked --test json_conformance -- --nocapture
