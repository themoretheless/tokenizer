name: Workspace CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace
    uses: themoretheless/.github/.github/workflows/rust-ci.yml@v1
    with:
      rust_toolchain: stable
      clippy_args: --locked --workspace --all-targets --all-features
      build_args: --locked --workspace --all-targets --all-features
      test_args: --locked --workspace --all-targets --all-features

  library:
    name: Library checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Check package
        run: cargo package --locked

  conformance:
    name: JSON conformance
    needs: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Checkout pinned JSONTestSuite corpus
        uses: actions/checkout@v7
        with:
          repository: nst/JSONTestSuite
          ref: 1ef36fa01286573e846ac449e8683f8833c5b26a
          path: json-test-suite
          sparse-checkout: test_parsing
          persist-credentials: false

      - name: Run JSON conformance corpus
        env:
          JSON_TEST_SUITE: ${{ github.workspace }}/json-test-suite
        run: cargo test --locked --test json_conformance -- --nocapture
