name: Copilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: themoretheless/.github/.github/workflows/copilot-review.yml@0e1f87dda0310901d9db8c0cb0b21b640fc4d85a # v1
    with:
      fail_on_comments: true
