name: Copilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Request and collect Copilot review
        uses: themoretheless/.github/.github/actions/copilot-review@a6c40a906bc786a3668362d270ca95212b5bffce # v1
        with:
          github-token: ${{ github.token }}
          # Copilot always emits an overview body; gate only actionable inline comments.
          fail-on-comments: true
