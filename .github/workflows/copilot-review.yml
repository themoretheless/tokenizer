name: Copilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: themoretheless/.github/.github/workflows/copilot-review.yml@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
    with:
      fail_on_comments: true
