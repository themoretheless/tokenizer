name: Copilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: themoretheless/.github/.github/workflows/copilot-review.yml@a6c40a906bc786a3668362d270ca95212b5bffce # v1
    with:
      fail_on_comments: true
