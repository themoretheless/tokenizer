name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo package version (for example, 0.2.0 or 0.3.0-preview.1)
        required: true
        type: string
      publish:
        description: Publish after the dry-run gate succeeds
        required: true
        type: boolean
        default: false
      confirmation:
        description: For publishing, enter "publish vX.Y.Z"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate branch and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.package.outputs.prerelease }}
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@345346381f30bbcdb6ba4899f29af8925fd4b6d3 # PR #11
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@345346381f30bbcdb6ba4899f29af8925fd4b6d3 # PR #11
        with:
          package-name: themoretheless-tokenizer

      - name: Validate ref and version
        env:
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          REQUESTED_VERSION: ${{ inputs.version }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "::error::Run this workflow against a branch, not a tag"
            exit 1
          fi

          if [[ "${REQUESTED_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Requested version ${REQUESTED_VERSION} does not match Cargo.toml ${VERSION}"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" && "${PRERELEASE}" != "true" ]]; then
            echo "::error::Only prerelease versions may be published outside main (for example, ${VERSION}-preview.1)"
            exit 1
          fi

      - name: Verify publishable package
        run: >-
          cargo publish --dry-run --locked
          --package themoretheless-tokenizer
          --registry crates-io

  publish:
    name: Publish confirmed package
    if: ${{ inputs.publish }}
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@345346381f30bbcdb6ba4899f29af8925fd4b6d3 # PR #11
        with:
          rust-toolchain: beta

      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TAG: ${{ needs.dry-run.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected="publish ${TAG}"
          if [[ "${CONFIRMATION}" != "${expected}" ]]; then
            echo "::error::Confirmation must be exactly: ${expected}"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          cargo publish --locked --package themoretheless-tokenizer --registry crates-io
