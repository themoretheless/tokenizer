name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo package version (for example, 0.2.0 or 0.3.0-preview.1)
        required: true
        type: string
      publish:
        description: Publish after the dry-run gate succeeds
        required: true
        type: boolean
        default: false
      confirmation:
        description: For publishing, enter the exact version (for example, 0.3.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate branch and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      prerelease: ${{ steps.package.outputs.prerelease }}
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          package-name: themoretheless-tokenizer

      - name: Validate ref and version
        uses: themoretheless/.github/.github/actions/validate-package-release@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          version: ${{ steps.package.outputs.version }}
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          requested-version: ${{ inputs.version }}

      - name: Align workspace package versions
        run: |
          set -euo pipefail
          expected="${{ steps.package.outputs.version }}"
          for manifest in \
            crates/tokenizer-core/Cargo.toml \
            crates/tokenizer-json/Cargo.toml \
            crates/tokenizer-url/Cargo.toml
          do
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' "${manifest}" | head -n 1)"
            if [ "${version}" != "${expected}" ]; then
              echo "Package version in ${manifest} is ${version}, expected ${expected}" >&2
              exit 1
            fi
          done

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Dry-run first package (core)
        # Dependent crates resolve path deps from crates.io during packaging, so
        # they can only dry-run after core is published. Validate core here.
        run: cargo publish --locked --dry-run -p themoretheless-tokenizer-core

  publish:
    name: Publish confirmed package
    if: ${{ inputs.publish }}
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          rust-toolchain: beta

      - name: Enforce exact confirmation input
        if: ${{ inputs.confirmation != needs.dry-run.outputs.version }}
        run: |
          echo "For publishing, confirmation must exactly match version '${{ needs.dry-run.outputs.version }}'." >&2
          exit 1

      - name: Validate explicit confirmation
        uses: themoretheless/.github/.github/actions/validate-package-release@2d3bc163ca57318e89e801795a0b0356d5a9d941 # first-party actions
        with:
          version: ${{ needs.dry-run.outputs.version }}
          tag: ${{ needs.dry-run.outputs.tag }}
          prerelease: ${{ needs.dry-run.outputs.prerelease }}
          confirmation: ${{ inputs.confirmation }}

      - name: Publish workspace packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_with_retry() {
            local package="$1"
            local attempt
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Publishing ${package} (attempt ${attempt})"
              if cargo publish --locked -p "${package}"; then
                return 0
              fi
              echo "Publish of ${package} failed; waiting for crates.io index..."
              sleep 30
            done
            echo "Failed to publish ${package}" >&2
            return 1
          }
          for package in \
            themoretheless-tokenizer-core \
            themoretheless-tokenizer-json \
            themoretheless-tokenizer-url \
            themoretheless-tokenizer
          do
            echo "::group::cargo publish -p ${package}"
            publish_with_retry "${package}"
            echo "::endgroup::"
          done
