name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo package version to validate or publish (for example, 0.2.0)
        required: true
        type: string
      publish:
        description: Publish after the dry-run gate succeeds
        required: true
        type: boolean
        default: false
      confirmation:
        description: For publishing, enter "publish vX.Y.Z"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate branch and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: themoretheless/.github/.github/actions/setup-rust@1911218e4f2afdff96901fdbc3d570192bb0cca9 # PR #11
        with:
          rust-toolchain: stable

      - name: Validate branch and version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Run this workflow against the main branch"
            exit 1
          fi

          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "${REQUESTED_VERSION}" != "${version}" ]]; then
            echo "::error::Requested version ${REQUESTED_VERSION} does not match Cargo.toml ${version}"
            exit 1
          fi

      - name: Verify publishable package
        run: >-
          cargo publish --dry-run --locked
          --package themoretheless-tokenizer
          --registry crates-io

  publish:
    name: Publish confirmed package
    if: ${{ inputs.publish }}
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: themoretheless/.github/.github/actions/setup-rust@1911218e4f2afdff96901fdbc3d570192bb0cca9 # PR #11
        with:
          rust-toolchain: stable

      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="publish v${REQUESTED_VERSION}"
          if [[ "${CONFIRMATION}" != "${expected}" ]]; then
            echo "::error::Confirmation must be exactly: ${expected}"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          cargo publish --locked --package themoretheless-tokenizer --registry crates-io
