name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo package version (for example, 0.2.0 or 0.3.0-preview.1)
        required: true
        type: string
      publish:
        description: Publish after the dry-run gate succeeds
        required: true
        type: boolean
        default: false
      confirmation:
        description: For publishing, enter "publish vX.Y.Z"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate branch and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.package.outputs.prerelease }}
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          rust-toolchain: beta

      - name: Resolve package version
        id: package
        uses: themoretheless/.github/.github/actions/cargo-package-version@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          package-name: themoretheless-tokenizer

      - name: Validate ref and version
        uses: themoretheless/.github/.github/actions/validate-package-release@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          version: ${{ steps.package.outputs.version }}
          tag: ${{ steps.package.outputs.tag }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          requested-version: ${{ inputs.version }}

      - name: Verify publishable package
        uses: themoretheless/.github/.github/actions/publish-crate@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          package-name: themoretheless-tokenizer
          dry-run: true

  publish:
    name: Publish confirmed package
    if: ${{ inputs.publish }}
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install beta Rust
        uses: themoretheless/.github/.github/actions/setup-rust@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          rust-toolchain: beta

      - name: Validate explicit confirmation
        uses: themoretheless/.github/.github/actions/validate-package-release@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          version: ${{ needs.dry-run.outputs.version }}
          tag: ${{ needs.dry-run.outputs.tag }}
          prerelease: ${{ needs.dry-run.outputs.prerelease }}
          confirmation: ${{ inputs.confirmation }}
          confirmation-prefix: publish

      - name: Publish to crates.io
        uses: themoretheless/.github/.github/actions/publish-crate@0afac90f53505a2c179a4b04f1b0c35ff341c7c0 # PR #11
        with:
          package-name: themoretheless-tokenizer
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
