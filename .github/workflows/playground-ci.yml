name: Playground CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playground-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Playground build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vue
        uses: themoretheless/.github/.github/actions/setup-vue@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          node-version: 22.13.0
          npm-cache-dependency-path: playground/package-lock.json
          working-directory: playground

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: beta
          targets: wasm32-unknown-unknown
          tools: wasm-pack@0.14.0,wasm-bindgen-cli@0.2.126

      - name: Build playground
        run: npm --prefix playground run build:pages

  tests:
    name: Playground tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vue
        uses: themoretheless/.github/.github/actions/setup-vue@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          node-version: 22.13.0
          npm-cache-dependency-path: playground/package-lock.json
          working-directory: playground

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2 # v1
        with:
          rust-toolchain: beta
          targets: wasm32-unknown-unknown
          tools: wasm-pack@0.14.0,wasm-bindgen-cli@0.2.126

      - name: Run playground tests
        run: npm test --prefix playground
