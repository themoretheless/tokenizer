name: Playground CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: playground-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Playground build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vue
        uses: themoretheless/.github/.github/actions/setup-vue@3cce368a1c5c4a117495646794d7f89fd5d6efa3 # v1
        with:
          node-version: 22.13.0
          npm-cache-dependency-path: playground/package-lock.json

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust-wasm@3cce368a1c5c4a117495646794d7f89fd5d6efa3 # v1
        with:
          rust-version: 1.96.0
          wasm-pack-version: 0.14.0
          wasm-bindgen-cli-version: 0.2.126

      - name: Install JavaScript dependencies
        run: npm ci --prefix playground

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Build playground
        run: npm --prefix playground run build:pages

  tests:
    name: Playground tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vue
        uses: themoretheless/.github/.github/actions/setup-vue@3cce368a1c5c4a117495646794d7f89fd5d6efa3 # v1
        with:
          node-version: 22.13.0
          npm-cache-dependency-path: playground/package-lock.json

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust-wasm@3cce368a1c5c4a117495646794d7f89fd5d6efa3 # v1
        with:
          rust-version: 1.96.0
          wasm-pack-version: 0.14.0
          wasm-bindgen-cli-version: 0.2.126

      - name: Install JavaScript dependencies
        run: npm ci --prefix playground

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Run playground tests
        run: npm test --prefix playground
