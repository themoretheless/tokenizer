name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust and WebAssembly
        uses: themoretheless/.github/.github/actions/setup-rust-web@v1
        with:
          node-version: 22.13.0
          rust-version: 1.96.0
          npm-cache-dependency-path: playground/package-lock.json
          wasm-pack-version: 0.14.0
          wasm-bindgen-cli-version: 0.2.126

      - name: Install JavaScript dependencies
        run: npm ci --prefix playground

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Build GitHub Pages site
        run: npm --prefix playground run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy_github_pages:
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: themoretheless/.github/.github/workflows/deploy-github-pages.yml@v1
