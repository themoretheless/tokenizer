[package]
name = "rush-lua-comparison"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "rush-lua-comparison"

[workspace]

[[bin]]
name = "rush-lua-comparison"
path = "../lua-runtime-shared.rs"

[dependencies]
mlua = { version = "=0.12.1", features = ["lua54", "vendored"] }
serde_json = "1"

[[bin]]
name = "rush-lua-cancellation"
path = "cancellation.rs"


[[bin]]
name = "rush-lua-host-object"
path = "../lua-host-object-shared.rs"

[[bin]]
name = "rush-lua-memory-limit"
path = "../lua-memory-limit-shared.rs"

[[bin]]
name = "rush-lua-errors"
path = "../lua-errors-shared.rs"

[[bin]]
name = "rush-lua-records"
path = "../lua-records-shared.rs"

[[bin]]
name = "rush-lua-startup"
path = "../lua-startup-shared.rs"
