[package]
name = "tokenizer-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
themoretheless-tokenizer = { path = "..", features = ["web-bridge", "all-languages"] }
wasm-bindgen = "=0.2.126"

[package.metadata.wasm-pack.profile.release]
# Match the instructions emitted by the current Rust toolchain.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
