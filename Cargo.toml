[workspace]
members = [
    "crates/tokenizer-core",
    "crates/tokenizer-languages",
    "crates/tokenizer-json",
    "crates/tokenizer-url",
    "crates/tokenizer-xml",
    "crates/tokenizer-html",
    "crates/tokenizer-css",
    "crates/tokenizer-yaml",
    "crates/tokenizer-toml",
    "crates/tokenizer-markdown",
    "crates/tokenizer-csv",
    "crates/tokenizer-logfmt",
    "crates/tokenizer-ini",
    "crates/tokenizer-hcl",
    "crates/tokenizer-edn",
    "crates/tokenizer-ics",
    "crates/tokenizer-srt",
    "crates/tokenizer-rush",
    "crates/rush-lang",
    "crates/tokenizer-forma",
    "wasm",
]
resolver = "3"

[package]
name = "themoretheless-tokenizer"
version = "0.8.0"
edition = "2024"
authors = ["Denis Mezhov"]
description = "Plugin-oriented lossless multi-language syntax engines (fullkit + JSON)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/themoretheless/tokenizer"
documentation = "https://docs.rs/themoretheless-tokenizer"
readme = "README.md"
publish = ["crates-io"]
keywords = ["tokenizer", "lexer", "json", "syntax-highlighting", "plugins"]
categories = ["parsing", "text-processing"]

[lib]
name = "themoretheless_tokenizer"
path = "src/lib.rs"

[dependencies]
themoretheless-tokenizer-core = { path = "crates/tokenizer-core", version = "0.8.0" }
themoretheless-tokenizer-languages = { path = "crates/tokenizer-languages", version = "0.8.0", optional = true }
themoretheless-tokenizer-forma = { path = "crates/tokenizer-forma", version = "0.8.0", optional = true }
themoretheless-tokenizer-json = { path = "crates/tokenizer-json", version = "0.8.0", optional = true }
themoretheless-tokenizer-url = { path = "crates/tokenizer-url", version = "0.8.0", optional = true }
themoretheless-tokenizer-xml = { path = "crates/tokenizer-xml", version = "0.8.0", optional = true }
themoretheless-tokenizer-html = { path = "crates/tokenizer-html", version = "0.8.0", optional = true }
themoretheless-tokenizer-css = { path = "crates/tokenizer-css", version = "0.8.0", optional = true }
themoretheless-tokenizer-yaml = { path = "crates/tokenizer-yaml", version = "0.8.0", optional = true }
themoretheless-tokenizer-toml = { path = "crates/tokenizer-toml", version = "0.8.0", optional = true }
themoretheless-tokenizer-markdown = { path = "crates/tokenizer-markdown", version = "0.8.0", optional = true }
themoretheless-tokenizer-csv = { path = "crates/tokenizer-csv", version = "0.8.0", optional = true }
themoretheless-tokenizer-logfmt = { path = "crates/tokenizer-logfmt", version = "0.8.0", optional = true }
themoretheless-tokenizer-ini = { path = "crates/tokenizer-ini", version = "0.8.0", optional = true }
themoretheless-tokenizer-hcl = { path = "crates/tokenizer-hcl", version = "0.8.0", optional = true }
themoretheless-tokenizer-edn = { path = "crates/tokenizer-edn", version = "0.8.0", optional = true }
themoretheless-tokenizer-ics = { path = "crates/tokenizer-ics", version = "0.8.0", optional = true }
themoretheless-tokenizer-srt = { path = "crates/tokenizer-srt", version = "0.8.0", optional = true }
themoretheless-tokenizer-rush = { path = "crates/tokenizer-rush", version = "0.8.0", optional = true }

[features]
default = ["json", "url"]
forma = ["dep:themoretheless-tokenizer-forma"]
json = ["dep:themoretheless-tokenizer-json"]
url = ["dep:themoretheless-tokenizer-url"]
xml = ["dep:themoretheless-tokenizer-xml"]
html = ["dep:themoretheless-tokenizer-html"]
css = ["dep:themoretheless-tokenizer-css"]
yaml = ["dep:themoretheless-tokenizer-yaml"]
toml = ["dep:themoretheless-tokenizer-toml"]
markdown = ["dep:themoretheless-tokenizer-markdown"]
csv = ["dep:themoretheless-tokenizer-csv"]
tsv = ["csv"]
logfmt = ["dep:themoretheless-tokenizer-logfmt"]
ini = ["dep:themoretheless-tokenizer-ini"]
properties = ["ini"]
hcl = ["dep:themoretheless-tokenizer-hcl"]
edn = ["dep:themoretheless-tokenizer-edn"]
ics = ["dep:themoretheless-tokenizer-ics"]
srt = ["dep:themoretheless-tokenizer-srt"]
vtt = ["srt"]
json5 = ["json"]
jsonl = ["json"]
rush = ["dep:themoretheless-tokenizer-rush"]

# Consolidated table-driven programming & query languages (`crates/tokenizer-languages`)
sql = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/sql"]
mongo = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/mongo"]
bash = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/bash"]
powershell = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/powershell"]
javascript = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/javascript"]
typescript = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/typescript"]
python = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/python"]
java = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/java"]
csharp = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/csharp"]
go = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/go"]
php = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/php"]
ruby = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/ruby"]
c = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/c"]
cpp = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/cpp"]
rust = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/rust"]
kotlin = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/kotlin"]
swift = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/swift"]
dart = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/dart"]
r = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/r"]
visualbasic = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/visualbasic"]
fortran = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/fortran"]
matlab = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/matlab"]
delphi = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/delphi"]
scala = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/scala"]
lua = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/lua"]
perl = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/perl"]
objectivec = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/objectivec"]
julia = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/julia"]
assembly = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/assembly"]
groovy = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/groovy"]
haskell = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/haskell"]
elixir = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/elixir"]
erlang = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/erlang"]
clojure = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/clojure"]
fsharp = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/fsharp"]
ocaml = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/ocaml"]
lisp = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/lisp"]
scheme = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/scheme"]
solidity = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/solidity"]
zig = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/zig"]
nim = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/nim"]
dlang = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/dlang"]
cobol = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/cobol"]
ada = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/ada"]
prolog = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/prolog"]
abap = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/abap"]
vhdl = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/vhdl"]
verilog = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/verilog"]
graphql = ["dep:themoretheless-tokenizer-languages", "themoretheless-tokenizer-languages/graphql"]

wave1 = ["xml", "html", "css", "yaml", "toml", "markdown"]
wave2 = ["sql", "mongo", "bash", "powershell"]
wave3 = ["javascript", "typescript"]
wave4 = ["python", "java", "csharp", "go", "php", "ruby"]
wave5 = ["c", "cpp", "rust", "kotlin", "swift", "dart", "r"]
wave6 = ["visualbasic", "fortran", "matlab", "delphi", "scala", "lua", "perl", "objectivec", "julia", "assembly", "rush"]
wave7 = [
    "groovy",
    "haskell",
    "elixir",
    "erlang",
    "clojure",
    "fsharp",
    "ocaml",
    "lisp",
    "scheme",
    "solidity",
    "zig",
    "nim",
    "dlang",
    "cobol",
    "ada",
    "prolog",
    "abap",
    "vhdl",
    "verilog",
    "graphql",
]
# TIOBE-style popular programming languages (fullkit / native where noted)
top20 = [
    "python",
    "c",
    "cpp",
    "java",
    "csharp",
    "javascript",
    "visualbasic",
    "sql",
    "go",
    "fortran",
    "matlab",
    "php",
    "rust",
    "r",
    "ruby",
    "kotlin",
    "swift",
    "typescript",
    "delphi",
    "assembly",
]
# Next 20 popular languages after top20 (FP, enterprise, hardware, web API)
next20 = ["wave7"]
# Format family: data, config and markup documents (core::family::FORMAT_IDS).
# Keeps pace with the format target list documented in docs/languages.md.
formats = ["json", "json5", "jsonl", "url", "xml", "html", "css", "yaml", "toml", "markdown", "csv", "tsv", "logfmt", "ini", "properties", "hcl", "edn", "ics", "srt", "vtt"]
all-languages = ["forma", "json", "url", "wave1", "wave2", "wave3", "wave4", "wave5", "wave6", "wave7", "formats"]
# web-bridge used by playground WASM/dev bridge. Pair with language features
# (or all-languages) so the host registry can resolve ids.
web-bridge = ["json"]

[[bin]]
name = "tokenizer-web-bridge"
path = "src/bin/tokenizer-web-bridge.rs"
required-features = ["web-bridge"]

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "json_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
